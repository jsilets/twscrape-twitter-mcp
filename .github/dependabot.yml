version: 2
updates:
  # This covers the `dev` extra (ruff, pytest) only. Dependabot's pip ecosystem
  # does not update [project] dependencies in a PEP 621 pyproject.toml, so it
  # never sees the twscrape pin, which is the one that matters. The
  # twscrape-watch workflow opens an issue for those releases instead. See
  # CONTRIBUTING.md -> "Bumping twscrape".
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - dependencies
    commit-message:
      prefix: deps

  # Keep the CI / release workflow action pins current.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: ci
